services:
  - type: web
    name: neuranote-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
